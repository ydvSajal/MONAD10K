[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.28"
# Monad docs confirm the P256 precompile (EIP-7951) but do not state a hardfork.
# cancun: OZ WebAuthn -> Bytes.sol uses MCOPY. Probed live on 10143 (eth_call override, 21 Sep): MCOPY + TSTORE execute.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${NEXT_PUBLIC_RPC_URL}"

[fmt]
line_length = 120
number_underscore = "thousands"
