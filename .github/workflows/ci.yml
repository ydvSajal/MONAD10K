name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# gitleaks-action lists a PR's commits through the API; a private repo's default token cannot.
permissions:
  contents: read
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # OpenZeppelin's own nested submodules are test-only and slow
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      # fork tests are skipped without MONAD_FORK_RPC; they hit live testnet
      - run: forge test -vvv

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SDK tests that need a deployment are skipped without GROUNDED_TEST_RPC,
      # so CI stays offline and deterministic (same rule as the Foundry fork tests).
      # Build the packages first: apps typecheck against the SDK's emitted dist/ types. The Next.js app is
      # built by Vercel on every PR, so building it here too only slows CI down.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm -r typecheck
      - run: pnpm -r test
